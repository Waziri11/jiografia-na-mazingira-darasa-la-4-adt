<img data-id="pg010_im160" src="images/pg010_im001.jpg" alt="Ramani ya Tanzania ya mipaka ya tawala za mikoa. Kaskazini imeelekezwa juu kwa alama ya Kas. Mikoa imetenganishwa kwa mipaka ya mkoa na imepakwa rangi tofauti ili iwe rahisi kuitofautisha. Mikoa ya Tanzania Bara iliyoandikwa ni Kagera, Geita, Mwanza, Mara, Simiyu, Shinyanga, Arusha, Kilimanjaro, Manyara, Tanga, Kigoma, Tabora, Singida, Dodoma, Katavi, Rukwa, Songwe, Mbeya, Iringa, Njombe, Morogoro, Pwani, Dar es Salaam, Lindi, Mtwara na Ruvuma. Upande wa visiwa vya Zanzibar yameandikwa maeneo ya Kaskazini Pemba, Kusini Pemba, Kaskazini Unguja na Kusini Unguja. Tanzania inapakana na Uganda upande wa kaskazini-magharibi; Rwanda, Burundi na Jamhuri ya Kidemokrasia ya Kongo upande wa magharibi; Zambia na Malawi upande wa kusini-magharibi; Msumbiji upande wa kusini; na Kenya upande wa kaskazini-mashariki. Upande wa mashariki kuna Bahari ya Hindi, iliyowasilishwa kwa rangi ya buluu. Maji mengine yaliyoandikwa ni Ziwa Viktoria kaskazini, Ziwa Tanganyika magharibi, Ziwa Nyasa kusini-magharibi, Ziwa Rukwa katika kusini-magharibi mwa nchi, pamoja na Ziwa Natron, Ziwa Eyasi na Ziwa Manyara kaskazini. Kwa mujibu wa ufunguo, mpaka wa mkoa umeoneshwa kwa mstari mwembamba, mpaka wa kimataifa kwa mstari mweusi mnene, na maji kwa rangi ya buluu. Chini kuna skeli ya mstari yenye sifuri katikati na kilometa mia tano kila upande. Chanzo ni Ofisi ya Takwimu Tanzania ya mwaka 2019; mmiliki ni Taasisi ya Elimu Tanzania, TET." class="mx-auto w-full rounded-lg object-contain" style="max-width: 100%; height: auto;">
