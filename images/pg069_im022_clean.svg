    <text x="462" y="78" text-anchor="middle">1</text>
    <text x="620" y="78" text-anchor="middle">2</text>
    <text transform="translate(137 70) rotate(-90)" text-anchor="middle">1000</text>
    <text transform="translate(224 70) rotate(-90)" text-anchor="middle">500</text>
  </g>
